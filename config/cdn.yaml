kind: "CDN"
version: "1"
metadata:
  envTypes: ["dev", "stage", "prod"]
data:
  # Shown when the Adobe-managed CDN cannot reach the AEM origin.
  # The CDN serves a minimal HTML shell; error.js renders the branded content.
  errorPages:
    spa:
      title: My Company
      icoUrl: https://marcore.github.io/aem-cdn-error-pages/favicon.ico
      cssUrl: https://marcore.github.io/aem-cdn-error-pages/error.css
      jsUrl: https://marcore.github.io/aem-cdn-error-pages/error.js
